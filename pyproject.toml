[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vortexcfd"
version = "0.1.0"
description = "STAR-CCM+-style CFD GUI frontend orchestrating OpenFOAM"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "pyvista",
    "pyvistaqt",
    "pydantic>=2.0",
    "foamlib>=1.8.1",
]

[project.scripts]
vortexcfd = "vortexcfd.gui.main_window:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "openfoam: marks tests that require an OpenFOAM installation",
    "slow: tests above ~5 s (real meshing runs); deselect with -m 'not slow'",
]
