[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vortexcfd"
version = "0.1.0"
description = "Integrated CFD workflow GUI for OpenFOAM"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "pyvista",
    "pyvistaqt",
    "pydantic>=2.0",
    "foamlib>=1.8.1",
    "matplotlib",  # colormaps of the Results Scene (already installed with PyVista; D-054)
    "cadquery-ocp-novtk",  # OpenCASCADE bindings without a bundled VTK: STEP/IGES/BREP import (D-070)
    "pymeshfix",  # surface repair (D-072)
    "pytetwild",  # fTetWild envelope, the repair fallback (D-072)
]

[project.scripts]
vortexcfd = "vortexcfd.gui.main_window:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "openfoam: marks tests that require an OpenFOAM installation",
    "slow: tests above ~5 s (real meshing runs); deselect with -m 'not slow'",
    "validation: numerics validation against reference solutions; run explicitly with -m validation",
    "long: real OpenFOAM runs above 60 s (studies, serial vs parallel); run explicitly with -m long",
]
