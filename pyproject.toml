[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdgui"
version = "0.1.0"
description = "STAR-CCM+-style CFD GUI frontend orchestrating OpenFOAM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "openfoam: marks tests that require an OpenFOAM installation",
]
